<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi proyecto Tailwind</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-cover bg-center bg-no-repeat">
    <section class="fondo-img">
        <img src="assets/img/fondo.png" alt="Fondo">
    </section>
    <section class="fondo-content">
        <div class="min-h-screen flex flex-col items-center justify-center px-6">

    <h1 class="text-5xl md:text-7xl font-bold text-white drop-shadow-2xl mb-4">
        BIENVENIDO
    </h1>

    <p class="text-white text-lg mb-10 drop-shadow-lg">
        Explora nuestras oportunidades
    </p>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 w-full max-w-2xl">

        <!-- Ver cursos -->
        <a href="#cursos"
           class="bg-white/20 backdrop-blur-md border border-white/30
                  rounded-2xl p-8 text-center text-white
                  hover:bg-white/40 hover:scale-105 transition duration-300">

            <div class="text-4xl mb-3">📚</div>
            <h2 class="text-xl font-bold">Ver cursos</h2>
            <p class="text-sm mt-2 text-white/80">Aprende y desarrolla tus habilidades</p>
        </a>

        <!-- Ver empleos -->
        <a href="#empleos"
           class="bg-white/20 backdrop-blur-md border border-white/30
                  rounded-2xl p-8 text-center text-white
                  hover:bg-white/40 hover:scale-105 transition duration-300">

            <div class="text-4xl mb-3">💼</div>
            <h2 class="text-xl font-bold">Ver empleos</h2>
            <p class="text-sm mt-2 text-white/80">Encuentra nuevas oportunidades</p>
        </a>

        <!-- Empresas -->
        <a href="#empresas"
           class="bg-white/20 backdrop-blur-md border border-white/30
                  rounded-2xl p-8 text-center text-white
                  hover:bg-white/40 hover:scale-105 transition duration-300">

            <div class="text-4xl mb-3">🏢</div>
            <h2 class="text-xl font-bold">Empresas</h2>
            <p class="text-sm mt-2 text-white/80">Conoce nuestras organizaciones</p>
        </a>

        <!-- Iniciar sesión -->
        <a href="#login"
           class="bg-blue-600/70 backdrop-blur-md border border-white/30
                  rounded-2xl p-8 text-center text-white
                  hover:bg-blue-500 hover:scale-105 transition duration-300">

            <div class="text-4xl mb-3">🔐</div>
            <h2 class="text-xl font-bold">Iniciar sesión</h2>
            <p class="text-sm mt-2 text-white/80">Accede a tu cuenta</p>
        </a>

    </div>
</div>
    </section>

</body>

</html>
