<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi proyecto Tailwind</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="shortcut icon" href="assets/img/fondo.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-cover bg-center bg-no-repeat">
    <section class="fondo-img">
        <img src="assets/img/fondo.png" alt="Fondo">
    </section>
    <section class="fondo-content">
        <div class="div-test">
            <h1 class="text-3xl md:text-7xl font-bold color-texto">
                Capacite, certifícate y consigue empleo en Cusco
            </h1>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 p-10 w-full max-w-2xl forms-test">

                <!-- Ver cursos -->
                <a href="#cursos" class="backdrop-blur-md border
                rounded-2xl p-2 text-center
                hover:bg-[#A13A5C]/40
                hover:border-[#A13A5C]
                hover:text-white
                hover:scale-105 transition duration-300
                input-forms cursos-input">
                    <i class="fa-solid fa-graduation-cap mr-2"></i>

                    <h2 class="text-xl font-bold text-input-class">Ver cursos</h2>
                </a>

                <!-- Ver empleos -->
                <a href="#empleos" class="backdrop-blur-md border
                rounded-2xl p-2 text-center
                hover:bg-[#A13A5C]/40
                hover:border-[#A13A5C]
                hover:text-white
                hover:scale-105 transition duration-300
                input-forms cursos-input">

                    <i class="fa-solid fa-briefcase mr-2"></i>
                    <h2 class="text-xl font-bold">Ver empleos</h2>
                </a>

                <!-- Empresas -->
                <a href="#empresas" class="backdrop-blur-md border
                rounded-2xl p-2 text-center
                hover:bg-[#A13A5C]/40
                hover:border-[#A13A5C]
                hover:text-white
                hover:scale-105 transition duration-300
                input-forms cursos-input">

                    <i class="fa-solid fa-building mr-2"></i>
                    <h2 class="text-xl font-bold">Empresas</h2>
                </a>

                <!-- Iniciar sesión -->
                <a href="#login" class="backdrop-blur-md border
                rounded-2xl p-2 text-center
                hover:bg-[#A13A5C]/40
                hover:border-[#A13A5C]
                hover:text-white
                hover:scale-105 transition duration-300
                input-forms cursos-input">

                    <i class="fa-solid fa-user mr-2"></i>
                    <h2 class="text-xl font-bold">Iniciar sesión</h2>
                </a>

            </div>
        </div>
    </section>

</body>

</html>
